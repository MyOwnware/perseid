name: Android setup
description: Set up the pinned JDK and Gradle and verify the runner SDK
runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-provider: basic
        validate-wrappers: true
    - name: Verify Android SDK
      shell: bash
      run: |
        test -f "$ANDROID_HOME/platforms/android-37.2/android.jar"
        test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
