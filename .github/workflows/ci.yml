name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Android checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit subjects
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-commits.sh "$BASE_SHA" "$HEAD_SHA"
      - uses: ./.github/actions/android-setup
      - name: Check and build
        run: ./gradlew ktlintCheck detekt lint testDebugUnitTest assembleDebug --warning-mode fail
