[changelog]
header = """
# Changelog

This project follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | split(pat=": ") | last }}
{% for commit in commits %}
- {{ commit.message }}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
sort_commits = "oldest"
commit_parsers = [
  { message = '^chore\(release\)!?:', skip = true },
  { message = '^[a-z]+\((ci|build|test|style|deps|docs)\)!?:', group = "4: Under the hood" },
  { message = "^feat", group = "1: New" },
  { message = "^perf", group = "2: Improvements" },
  { message = "^fix", group = "3: Fixes" },
  { message = "^(build|chore|ci|docs|refactor|style|test)", group = "4: Under the hood" },
]
